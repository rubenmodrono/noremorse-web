<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reel 1 · La curva</title>
<link rel="stylesheet" href="common.css"><style>
#pills{position:absolute;left:60px;right:60px;top:1330px;display:flex;gap:18px;flex-wrap:wrap}
#rows,#rows0{position:absolute;left:60px;right:60px;top:1320px}
.row{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 30px;margin-bottom:14px;font:600 38px 'DejaVu Sans Mono',monospace;height:96px}
.row .n{color:var(--mut);width:56px}.row .bpm{width:260px}.row .en{flex:1;color:var(--mut)}
#ribbon{position:absolute;left:60px;right:60px;top:1340px}
.rline{display:flex;gap:16px;align-items:center;justify-content:center;margin-bottom:34px}.arr{color:#4a5063;font-size:36px}
#ok{position:absolute;left:60px;right:60px;top:1640px;text-align:center;font-size:46px;font-weight:700}#ok span{color:var(--green)}
#cta{position:absolute;left:0;right:0;top:1330px}
</style></head><body>
<div id="pills"></div><div id="rows0"></div><div id="rows"></div><div id="ribbon"></div><div id="ok"></div><div id="cta"></div>
<script src="cues1.js"></script><script src="data.js"></script><script src="common.js"></script>
<script>
const DATA=window.SET1,N=DATA.length,CX0=110,CX1=970,CY0=560,CY1=1200;
const X=i=>CX0+i*(CX1-CX0)/(N-1),Y=e=>CY1-(CY1-CY0)*e/10;
const REAL=DATA.map(d=>d.energy),JAG=[6.2,2.1,8.8,3.0,7.4,1.6,9.2,4.1,8.0,2.6];
let bands,grid,path,glow,dots,head;
window.init=()=>{
  const defs=el('defs',{});const g=el('linearGradient',{id:'lg',x1:0,x2:1,y1:0,y2:0},defs);
  el('stop',{offset:0,'stop-color':'#2a78d6'},g);el('stop',{offset:.55,'stop-color':'#ff3d71'},g);el('stop',{offset:1,'stop-color':'#f0c030'},g);
  bands=[["Warmup",0,2,"#2a78d6"],["Peak time",3,7,"#ff3d71"],["Closing",8,9,"#f0c030"]].map(([n,a,b,c])=>{
    const x0=X(a)-(a?(X(1)-X(0))/2:50),x1=X(b)+(b<N-1?(X(1)-X(0))/2:50);
    const r=el('rect',{x:x0,y:CY0-20,width:x1-x0,height:CY1-CY0+40,rx:22,fill:c,opacity:0});
    const t=el('text',{x:(x0+x1)/2,y:CY1+70,'text-anchor':'middle',fill:c,'font-size':34,'font-weight':800,opacity:0,'font-family':'Inter'});t.textContent=n.toUpperCase();return{r,t}});
  grid=[0,5,10].map(v=>el('line',{x1:60,x2:1020,y1:Y(v),y2:Y(v),stroke:'#232838','stroke-width':2,opacity:0}));
  path=el('path',{fill:'none',stroke:'url(#lg)','stroke-width':12,'stroke-linecap':'round','stroke-linejoin':'round'});
  glow=el('path',{fill:'none',stroke:'url(#lg)','stroke-width':30,'stroke-linecap':'round',opacity:0,filter:'blur(14px)'});
  dots=DATA.map(d=>el('circle',{r:13,fill:'#fff',stroke:col(d.key),'stroke-width':7,opacity:0}));
  head=el('circle',{r:20,fill:'#fff',opacity:0});
};
const LS=[["Tema 07",9.2],["Tema 02",2.1],["Tema 11",8.8],["Tema 05",3.0]];
window.render=t=>{
  caption(t,[[0,"Tu set no es <em>una lista</em>","de buenos temas."],[S(1),"Es una <em>curva.</em>",""],[S(2),"Defines duración,","género y <em>energía</em>"],
    [S(3),"Calentar.","<em>Subir.</em> Cerrar."],[S(6),"Cada tema con","<em>BPM, energía</em> y clave"],[S(7),"Una ruta armónica","que <em>suena bien</em>"],
    [S(8),"Tu set tiene <em>forma</em>","antes del primer tema"],[S(9),"",""]]);
  const morph=ease(seg(t,S(1),S(1)+1.5)),draw=ease(seg(t,.3,S(1)-.4));
  const pts=REAL.map((e,i)=>[X(i),Y(JAG[i]+(e-JAG[i])*morph)]);const d=cr(pts);path.setAttribute('d',d);glow.setAttribute('d',d);
  const L=path.getTotalLength(),vis=t<S(1)?draw:1;path.setAttribute('stroke-dasharray',`${L} ${L}`);path.setAttribute('stroke-dashoffset',L*(1-vis));
  path.setAttribute('opacity',t<S(1)?.55+.2*draw:1);grid.forEach(l=>l.setAttribute('opacity',seg(t,S(1),S(1)+.9)*.9));
  const bs=[S(3),S(4)-.1,S(5)-.1],bk=1-seg(t,S(6),S(6)+.6)*.6;
  bands.forEach((b,i)=>{const a=out(seg(t,bs[i],bs[i]+.35));b.r.setAttribute('opacity',a*.16*bk);b.t.setAttribute('opacity',a*bk)});
  dots.forEach((c,i)=>{const s=S(6)+.3+i*((E(6)-S(6)-.8)/N),a=out(seg(t,s,s+.25));c.setAttribute('cx',pts[i][0]);c.setAttribute('cy',pts[i][1]);c.setAttribute('r',13*a);c.setAttribute('opacity',a)});
  const gl=seg(t,S(8),S(8)+.8);glow.setAttribute('opacity',gl*(.35+.15*Math.sin(t*5)));
  const ph=ease(seg(t,S(8),E(8)));const pt=path.getPointAtLength(L*ph);head.setAttribute('cx',pt.x);head.setAttribute('cy',pt.y);head.setAttribute('opacity',gl*(1-seg(t,E(8),E(8)+.4)));
  // lista sin orden (antes de la curva)
  const R0=$('rows0');if(t<S(1)+.4){R0.style.opacity=seg(t,.5,1)*(1-seg(t,S(1)-.2,S(1)+.4));R0.innerHTML=LS.map(([n,e],i)=>`<div class="row" style="opacity:${out(seg(t,.5+i*.2,.9+i*.2))}"><span class="n"></span><span class="bpm">${n}</span><span class="en">E ${e.toFixed(1)}</span><span class="chip" style="background:#3a3f50;color:#9aa1b5">?</span></div>`).join('')}else R0.innerHTML='';
  const P=$('pills');if(t>=S(2)&&t<S(6)){const it=[["Duración","60 min"],["Temas",N],["Mezcla","Camelot"]];P.style.opacity=1-seg(t,S(6)-.4,S(6));
    P.innerHTML=it.map(([a,b],i)=>{const o=out(seg(t,S(2)+.2+i*.5,S(2)+.6+i*.5));return `<div class="pill" style="opacity:${o};transform:translateY(${(1-o)*30}px)"><small>${a}</small>${b}</div>`}).join('')}else P.innerHTML='';
  const R=$('rows');if(t>=S(6)&&t<S(7)){const per=(E(6)-S(6))/ (N-3),k=Math.min(N,Math.floor((t-S(6))/per)+1);R.style.opacity=1-seg(t,S(7)-.3,S(7));
    R.innerHTML=DATA.slice(Math.max(0,k-4),k).map(d=>`<div class="row"><span class="n">${String(d.i).padStart(2,'0')}</span><span class="bpm">${d.bpm.toFixed(1)} BPM</span><span class="en">E ${d.energy.toFixed(1)}</span><span class="chip" style="background:${col(d.key)}">${d.key}</span></div>`).join('')}else R.innerHTML='';
  const B=$('ribbon'),OK=$('ok');if(t>=S(7)&&t<S(9)){let n=0;B.style.opacity=1-seg(t,S(9)-.4,S(9));
    B.innerHTML=[DATA.slice(0,5),DATA.slice(5)].map(r=>`<div class="rline">`+r.map((d,j)=>{const a=out(seg(t,S(7)+.1+(n++)*.2,S(7)+.45+(n-1)*.2));return (j?`<span class="arr" style="opacity:${a}">→</span>`:'')+`<span class="chip" style="background:${col(d.key)};opacity:${a};transform:scale(${.6+.4*a})">${d.key}</span>`}).join('')+`</div>`).join('');
    OK.style.opacity=seg(t,E(7),E(7)+.5)*(1-seg(t,S(9)-.4,S(9)));OK.innerHTML=`<span>9/9</span> transiciones válidas`}else{B.innerHTML='';OK.innerHTML=''}
  $('cta').innerHTML=t>=S(9)?ctaHTML('Comenta CURVA',S(9),t,'y te cuento cómo<br><b>Planes de set en 24h</b>'):'';
};
</script></body></html>
