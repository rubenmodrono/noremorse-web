<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Reel 5 · Oferta</title>
<link rel="stylesheet" href="common.css"><style>
.step{position:absolute;left:60px;right:60px;height:200px;background:var(--panel);border:1px solid var(--line);border-radius:30px;display:flex;align-items:center;gap:30px;padding:0 36px}
.num{flex:none;width:90px;height:90px;border-radius:50%;background:var(--pink);color:#fff;font-size:64px;font-weight:800;display:flex;align-items:center;justify-content:center}
.step h3{font-size:52px;font-weight:800;letter-spacing:-.02em}
.step p{font-size:34px;color:var(--mut);font-weight:600;margin-top:8px}
.tags{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.tags span{background:#1c2130;border-radius:999px;padding:8px 22px;font-size:34px;font-weight:700}
#price{position:absolute;left:60px;right:60px;top:1160px;display:flex;align-items:center;justify-content:center;gap:50px}
#price .big{font-size:170px;font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1}
#price .big small{font-size:90px;color:var(--pink)}
.dots{display:flex;gap:16px;margin-bottom:14px}.dots i{width:46px;height:46px;border-radius:50%;background:var(--pink);display:block}
#price .pl{font-size:38px;color:var(--mut);font-weight:700}
#guar{position:absolute;left:0;right:0;top:1350px;text-align:center}
#guar span{display:inline-block;border:2px solid var(--green);color:var(--green);border-radius:999px;padding:16px 40px;font-size:42px;font-weight:700}
#cta{position:absolute;left:0;right:0;top:1450px}
</style></head><body>
<div id="steps"></div><div id="price"></div><div id="guar"></div><div id="cta"></div>
<script src="cues5.js"></script><script src="data.js"></script><script src="common.js"></script>
<script>
const Y0=[500,716,932];let ring,arc,hrs;
const spark=()=>{const D=window.SET1,w=300,h=90,p=D.map((d,i)=>[i*(w/(D.length-1)),h-h*d.energy/10]);return `<svg width="${w}" height="${h+10}" viewBox="0 -5 ${w} ${h+10}"><path d="${cr(p)}" fill="none" stroke="url(#sg)" stroke-width="7" stroke-linecap="round"/><defs><linearGradient id="sg"><stop offset="0" stop-color="#2a78d6"/><stop offset=".55" stop-color="#ff3d71"/><stop offset="1" stop-color="#f0c030"/></linearGradient></defs></svg>`};
window.init=()=>{
  $('steps').innerHTML=[
   `<div class="num">1</div><div><h3>Me cuentas</h3><div class="tags"><span>Género</span><span>Duración</span><span>Tipo de sala</span></div></div>`,
   `<div class="num">2</div><div><h3>Recibes tu plan</h3><div style="display:flex;align-items:center;gap:26px">${spark()}<div class="tags" style="margin:0"><span class="mono">126 BPM</span><span class="chip" style="background:${col(8)};font-size:32px;min-width:0;padding:6px 18px">8A</span><span>E 7.3</span></div></div></div>`,
   `<div class="num">3</div><div><h3>Lo importas</h3><p>con tu colección, listo para tu programa</p><div class="tags"><span>Rekordbox XML</span><span>M3U8</span></div></div>`
  ].map((h,i)=>`<div class="step" style="top:${Y0[i]}px;opacity:0">${h}</div>`).join('');
  const defs=el('defs',{});const g=el('linearGradient',{id:'rg',x1:0,x2:1,y1:0,y2:1},defs);el('stop',{offset:0,'stop-color':'#2a78d6'},g);el('stop',{offset:1,'stop-color':'#ff3d71'},g);
  ring=el('circle',{cx:540,cy:830,r:250,fill:'none',stroke:'#1c2130','stroke-width':30,opacity:0});
  arc=el('circle',{cx:540,cy:830,r:250,fill:'none',stroke:'url(#rg)','stroke-width':30,'stroke-linecap':'round',transform:'rotate(-90 540 830)',opacity:0});
  hrs=el('text',{x:540,y:895,'text-anchor':'middle','font-size':220,'font-weight':800,fill:'#fff','font-family':'Inter',opacity:0});hrs.textContent='24h';
};
window.render=t=>{
  caption(t,[[0,"Tu set planificado","en <em>24 horas</em>"],[S(1),"Me <em>cuentas</em>","lo que necesitas"],[S(2),"Recibes","tu <em>curva</em>"],[S(3),"Y lo <em>importas</em>",""],
    [S(4),"<em>19 €</em> · solo 5","plazas"],[S(5),"Sin riesgo",""],[S(6),"",""]]);
  const C=2*Math.PI*250,pr=ease(seg(t,.2,E(0)-.2)),fade=1-seg(t,S(1)-.3,S(1)+.2);
  ring.setAttribute('opacity',fade);arc.setAttribute('opacity',fade);hrs.setAttribute('opacity',fade);
  arc.setAttribute('stroke-dasharray',`${C*pr} ${C}`);
  document.querySelectorAll('.step').forEach((s,i)=>{const a=out(seg(t,S(i+1)+.1,S(i+1)+.6));s.style.opacity=a;s.style.transform=`translateY(${(1-a)*50}px)`});
  const pa=out(seg(t,S(4),S(4)+.5)),n=5;
  $('price').style.opacity=pa;$('price').innerHTML=pa>0?`<div class="big">19<small>€</small></div><div><div class="dots">${'<i></i>'.repeat(n)}</div><div class="pl">SOLO 5 PLAZAS</div></div>`:'';
  $('guar').innerHTML=t>=S(5)?`<span style="opacity:${out(seg(t,S(5),S(5)+.5))}">Si no te sirve, te devuelvo el dinero</span>`:'';
  $('cta').innerHTML=t>=S(6)?ctaHTML('Comenta SET',S(6),t,'o escríbeme por mensaje<br><b>nØr3mors3</b>'):'';
};
</script></body></html>
